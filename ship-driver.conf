    "init": {
      "freq": 400,
      "light": 0,
      "motor": 1
    },
    // Газ моторов задаётся ЧАСТОТОЙ при постоянной скважности motor_duty:
    // импульс = motor_duty*1e4/f. Ползунок 0..throttle_max, где 0 = выхода нет совсем,
    // 1 = pulse_idle_us, throttle_max = pulse_top_us. Шаг деления = 10.1 мкс против
    // 25 мкс у прежней шкалы скважности 40..80 (она больше не действует).
    // Ход ползунка нелинейный: деление 1 = холостой, 2 = pulse_start_us (измеренная точка
    // страгивания), дальше кривая x**throttle_gamma до pulse_top_us. gamma=1.0 вернёт линейную.
    // Замер 25.08 на стенде без винтов: 1037 мкс — один вал дёргается, 1042 — крутятся два,
    // 1048 — все четыре. Прежде деления 2..14 лежали в мёртвой зоне и не давали ничего.
    // gamma=1.0 вернёт линейную шкалу. Круче 1.5 бессмысленно: шаг импульса опускается
    // ниже 1.67 мкс, которые железо различает у холостого, и деления дают одну частоту.
    // Замер 25.08 на стенде: модуль принимает любые целые герцы, ESC держит 300..666 Гц.
    // pulse_start_us МЕРИТСЯ НА КАЖДОЙ УСТАНОВКЕ и переносу не подлежит: на стенде без
    // винтов вал шёл с 1047 мкс, а на борту 9 под нагрузкой деления 2..12 дали ровную
    // полку по току (мотор на минимальных оборотах, газ не влияет) и рост начался с
    // 1080. Инструмент: tools/thr-current.py — ступенчатый проход с замером тока АКБ.
    "limits": {
      "motor_duty": 60,
      "stop_idle_s": 1,
      "stop_tries": 6,
      "motor_max": 80,
      "motor_min": 40,
      "mp3_track_max": 15,
      "pulse_idle_us": 1000,
      "pulse_start_us": 1047,
      "pulse_top_us": 2000,
      "throttle_gamma": 1.5,
      "throttle_max": 100
    },
    // Морзянка: световой канал morse_lamp работает переключателем, а не ползунком.
    // Частота ставится низкой, символ кодируется ШИРИНОЙ импульса: точка короткая
    // вспышка, тире длинная, пауза — скважность 0. Форму держит модуль, драйвер
    // только вовремя переписывает один регистр (одна запись на символ).
    // Минимум частоты у pwm8a04 — 1 Гц, проверено 25.08. Паузы заданы в периодах.
    "morse": {
      "channel": "morse_lamp",
      "cycle_gap": 4,
      "dash": 60,
      "dot": 20,
      "hz": 2,
      "letter_gap": 1,
      "text": "AHOY VOLGA",
      "word_gap": 3
    },
    "rates": {
      "CHARGING": {
        "charge": 20,
        "current": 5,
        "freq_check": 10,
        "pwm_readback": 30,
        "temp": 10
      },
      "IDLE": {
        "charge": 60,
        "current": 5,
        "freq_check": 10,
        "pwm_readback": 60,
        "temp": 60
      },
      "SAILING": {
        "charge": 60,
        "current": 2,
        "freq_check": 10,
        "pwm_readback": 30,
        "temp": 60
      },
      "offline_fails": 3,
      // Датчик курса: «его на борту нет» — вывод сильный, и делается ТОЛЬКО про тот,
      // который не ответил ни разу. 25.08 драйвер объявил отсутствующим датчик,
      // отвечавший минутой раньше: хватило трёх потерянных кадров при RSSI -57, и
      // плашка курса 26 минут горела красным с замороженными значениями.
      "sensor_giveup": 10,
      "sensor_retry_s": 60,
      "sail_timeout_s": 30,
      "search_period": 0.05,
      "service_period": 1
    },
    // Замер 25.08 на борту 9 (RSSI -48, air_rate 62.5): 220 транзакций, 0 неответов,
    // самая длинная (датчик, 13 регистров = 31 байт) p50=119 макс=121 мс, остальные 70-84 мс.
    // Модем в прозрачном режиме не переспрашивает, поэтому ждать дольше времени полёта
    // бессмысленно: кадр либо пришёл, либо потерян. 0.3 с = 2.5x от самой длинной.
    // ВАЖНО: при снижении air_rate для дальности время полёта растёт кратно — поднять и это.
    "resp_timeout_s": 0.3
  },
